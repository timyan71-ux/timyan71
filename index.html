<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYSTEM ERROR: Queue Portal</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-red: #ef4444;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background-color: var(--card-bg);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      border: 1px solid #334155;
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header h1 {
      font-size: 1.5rem;
      color: var(--accent-red);
      margin-bottom: 8px;
    }

    .header p {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-option {
      background: #334155;
      border: 2px solid #475569;
      color: var(--text-color);
      padding: 16px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-option:hover {
      border-color: var(--accent-red);
      background: #3e4c5e;
    }

    .badge {
      font-size: 0.75rem;
      background: var(--accent-red);
      padding: 4px 8px;
      border-radius: 6px;
      animation: pulse 1.5s infinite;
    }

    /* Modal Overlay */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 100;
    }

    .modal {
      background: var(--card-bg);
      border: 2px solid var(--accent-red);
      border-radius: 16px;
      padding: 30px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 5px solid #334155;
      border-top: 5px solid var(--accent-red);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    .error-icon {
      font-size: 3rem;
      color: var(--accent-red);
      margin-bottom: 12px;
      display: none;
    }

    .counter {
      font-size: 1.2rem;
      font-weight: bold;
      margin: 12px 0;
      color: #fbbf24;
    }

    .btn-retry {
      background: var(--accent-red);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 16px;
      display: none;
      width: 100%;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>⚠️ SYSTEM QUEUE ⚠️</h1>
      <p>Select an option to proceed with your booking/registration.</p>
    </div>

    <div class="options-grid">
      <button class="btn-option" onclick="startProcess('VART Course Reg')">
        📚 Reg VART Course <span class="badge">0 QUOTA LEFT</span>
      </button>
      <button class="btn-option" onclick="startProcess('Concert Ticket')">
        🎤 Taylor Swift Ticket <span class="badge">99k QUEUE</span>
      </button>
      <button class="btn-option" onclick="startProcess('Flight Ticket')">
        ✈️ $0 HK Express Ticket <span class="badge">HIGH TRAFFIC</span>
      </button>
    </div>
  </div>

  <div class="overlay" id="overlay">
    <div class="modal">
      <div class="spinner" id="spinner"></div>
      <div class="error-icon" id="errorIcon">❌</div>
      
      <h2 id="modalTitle">Connecting to Server...</h2>
      <div class="counter" id="queueStatus">Position in queue: 9,842</div>
      <p id="modalDesc" style="color: var(--text-muted); font-size: 0.9rem;">
        Please do not refresh the page.
      </p>

      <button class="btn-retry" id="retryBtn" onclick="resetModal()">TRY AGAIN (FAIL AGAIN)</button>
    </div>
  </div>

  <script>
    function startProcess(item) {
      const overlay = document.getElementById('overlay');
      const spinner = document.getElementById('spinner');
      const errorIcon = document.getElementById('errorIcon');
      const title = document.getElementById('modalTitle');
      const status = document.getElementById('queueStatus');
      const desc = document.getElementById('modalDesc');
      const retryBtn = document.getElementById('retryBtn');

      // Reset state
      overlay.style.display = 'flex';
      spinner.style.display = 'block';
      errorIcon.style.display = 'none';
      retryBtn.style.display = 'none';
      title.innerText = "Processing Request...";
      status.innerText = "Position in queue: " + Math.floor(Math.random() * 5000 + 5000);
      desc.innerText = "Processing high volume of traffic. Please wait...";

      // Fake queue countdown
      let currentQueue = 842;
      const interval = setInterval(() => {
        currentQueue -= Math.floor(Math.random() * 200 + 50);
        if (currentQueue > 50) {
          status.innerText = "Position in queue: " + currentQueue;
        } else {
          clearInterval(interval);
          triggerFailure(item);
        }
      }, 600);
    }

    function triggerFailure(item) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('errorIcon').style.display = 'block';
      document.getElementById('modalTitle').innerText = "SYSTEM ERROR / FAILED";
      document.getElementById('queueStatus').innerText = "STATUS: 404 OUT OF QUOTA";
      document.getElementById('queueStatus').style.color = "#ef4444";
      document.getElementById('modalDesc').innerText = "Sorry, " + item + " is no longer available. Session timed out.";
      document.getElementById('retryBtn').style.display = 'block';
    }

    function resetModal() {
      document.getElementById('overlay').style.display = 'none';
      document.getElementById('queueStatus').style.color = "#fbbf24";
    }
  </script>
</body>
</html>
