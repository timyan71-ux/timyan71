<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Match AR! - Story 1 : Cafe Mission</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <style>
        :root {
            --caramel: #C08552;    /* 焦糖色 */
            --brownie: #5E3023;    /* 布朗尼深棕色 */
            --coffee: #895737;     /* 咖啡色 */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            image-rendering: pixelated;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--cream);
            font-family: 'VT323', monospace;
            touch-action: manipulation;
        }

        /* 背景圖片 cafe.png */
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('cafe.png') no-repeat center center;
            background-size: cover;
            z-index: -1;
        }

        /* 角色容器 */
        .character-container {
            position: absolute;
            bottom: 25vh;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 0 5%;
            pointer-events: none; 
            z-index: 5;
        }

        .character {
            width: 45vw;
            max-width: 280px;
            height: auto;
            transition: all 0.2s steps(2);
            filter: brightness(0.6) grayscale(0.4);
            transform: scale(0.9);
            opacity: 0.8;
        }

        .character.active {
            filter: brightness(1) grayscale(0);
            transform: scale(1.1);
            opacity: 1;
            z-index: 10;
        }

        /* 對話框 - 暖甜點色調 (奶油基底 + 焦糖邊框) */
        .pixel-dialogue {
            position: absolute;
            bottom: 30px;
            left: 5%;
            width: 90%;
            min-height: 140px;
            background: var(--cream);
            border: 4px solid var(--caramel);
            box-shadow: 
                0 4px 0 -1px var(--brownie),
                0 -4px 0 -1px var(--brownie),
                4px 0 0 -1px var(--brownie),
                -4px 0 0 -1px var(--brownie);
            padding: 15px;
            z-index: 20;
            cursor: pointer;
        }

        .name-tag {
            font-size: 22px;
            color: var(--cream);
            background: var(--caramel);
            padding: 2px 10px;
            border: 2px solid var(--brownie);
            position: absolute;
            top: -20px;
            left: 10px;
        }

        .message {
            font-size: 26px;
            color: var(--brownie);
            line-height: 1.2;
            margin-top: 5px;
        }

        .next-hint {
            position: absolute;
            right: 15px;
            bottom: 10px;
            font-size: 18px;
            color: var(--caramel);
            animation: bounce 0.6s steps(2) infinite;
        }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(4px); }
        }

        /* 開始遊戲按鈕畫面 */
        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--cream);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 100;
        }

        .mission-box {
            border: 6px solid var(--caramel);
            background: white;
            padding: 25px;
            width: 85%;
            text-align: center;
            box-shadow: 6px 6px 0 var(--coffee);
        }

        .mission-title {
            font-size: 36px;
            color: #d32f2f;
            margin-bottom: 15px;
        }

        .mission-text {
            font-size: 24px;
            color: var(--brownie);
            line-height: 1.3;
            margin-bottom: 30px;
        }

        .btn-start {
            font-family: 'VT323', monospace;
            font-size: 32px;
            background: var(--caramel);
            color: var(--cream);
            border: 3px solid var(--brownie);
            padding: 10px 35px;
            cursor: pointer;
            box-shadow: 4px 4px 0 var(--coffee);
            transition: 0.05s linear;
            margin-top: 10px;
        }

        .btn-start:active {
            transform: translate(3px, 3px);
            box-shadow: 1px 1px 0 var(--coffee);
        }
    </style>
</head>
<body onclick="handleScreenClick()">

    <!-- 背景 cafe.png -->
    <div class="background"></div>

    <!-- 角色區：左側食咩狗，右側書蟲 -->
    <div class="character-container">
        <img id="hungrydog" class="character" src="食咩狗01-norm.png" alt="Hungry Dog">
        <img id="bookworm" class="character" src="書蟲01-norm.png" alt="Bookworm">
    </div>

    <!-- 對話框 -->
    <div class="pixel-dialogue" id="dialogue-box">
        <div class="name-tag" id="speaker-name">食咩狗</div>
        <div class="message" id="message-text">Coffee is not enough... I'm starving.</div>
        <div class="next-hint">TAP TO NEXT ➔</div>
    </div>

    <!-- 故事結束後顯示 Start Matching Game 按鈕 -->
    <div id="start-screen">
        <div class="mission-box">
            <h1 class="mission-title">🍽️ LET'S HELP!</h1>
            <p class="mission-text">Find real food for the hungry dog!<br>Use your camera to match the targets.</p>
            <button class="btn-start" id="start-matching-btn">▶ START MATCHING GAME</button>
        </div>
    </div>

    <script>
        // 故事對話流程 (4段對話)
        const story = [
            {
                name: "食咩狗",
                text: "Coffee is not enough... I'm starving.",
                active: "hungrydog",
                imageLeft: "食咩狗01-norm.png"
            },
            {
                name: "食咩狗",
                text: "I'm starving too much, the world is turning around—I cannot eat…!",
                active: "hungrydog",
                imageLeft: "食咩狗01-norm.png"
            },
            {
                name: "書蟲",
                text: "Don't die! Stay alive!",
                active: "bookworm",
                imageRight: "書蟲02-sad.png"
            },
            {
                name: "書蟲",
                text: "You need real food. I'll help you to get it.",
                active: "bookworm",
                imageRight: "書蟲01-norm.png"
            }
        ];

        let currentLine = 0;
        let storyFinished = false;

        // 獲取角色圖片元素
        const hungrydogImg = document.getElementById('hungrydog');
        const bookwormImg = document.getElementById('bookworm');

        // 更新 UI (角色高亮 + 對話內容 + 切換書蟲圖片)
        function updateUI() {
            if (currentLine < story.length) {
                const line = story[currentLine];
                document.getElementById('speaker-name').innerText = line.name;
                document.getElementById('message-text').innerText = line.text;
                
                // 切換角色 active 狀態
                hungrydogImg.classList.toggle('active', line.active === 'hungrydog');
                bookwormImg.classList.toggle('active', line.active === 'bookworm');
                
                // 根據對話切換書蟲圖片 (第3句用 sad，第4句用 norm)
                if (line.active === 'bookworm') {
                    if (line.imageRight === '書蟲02-sad.png') {
                        bookwormImg.src = '書蟲02-sad.png';
                    } else if (line.imageRight === '書蟲01-norm.png') {
                        bookwormImg.src = '書蟲01-norm.png';
                    }
                }
                
                // 確保食咩狗圖片正確 (保持相同)
                if (line.active === 'hungrydog' && hungrydogImg.src.indexOf('食咩狗01-norm.png') === -1) {
                    hungrydogImg.src = '食咩狗01-norm.png';
                }
            } else {
                // 故事結束：隱藏對話框，顯示開始遊戲按鈕畫面
                storyFinished = true;
                document.getElementById('dialogue-box').style.display = 'none';
                document.getElementById('start-screen').style.display = 'flex';
            }
        }

        // 點擊畫面觸發下一句
        function handleScreenClick() {
            if (!storyFinished) {
                currentLine++;
                updateUI();
            }
        }

        // 跳轉到 matchinggame.html
        function goToMatchingGame() {
            window.location.href = 'matchinggame.html';
        }

        // 綁定開始按鈕事件，並預載角色圖片
        window.onload = function() {
            // 設定初始圖片
            hungrydogImg.src = '食咩狗01-norm.png';
            bookwormImg.src = '書蟲01-norm.png';
            
            // 圖片錯誤處理
            hungrydogImg.onerror = () => { console.log("⚠️ 食咩狗01-norm.png 無法載入，請檢查圖片路徑"); };
            bookwormImg.onerror = () => { console.log("⚠️ 書蟲圖片無法載入，請檢查圖片路徑"); };
            
            updateUI();
            const startBtn = document.getElementById('start-matching-btn');
            if (startBtn) {
                startBtn.addEventListener('click', function(e) {
                    e.stopPropagation();
                    goToMatchingGame();
                });
            }
        };
    </script>
</body>
</html>
