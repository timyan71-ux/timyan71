以下是將您提供的 HTML 代碼改為「暖甜點色調 + 像素風格」的版本。整體視覺從棕色主題轉換為奶油、焦糖、咖啡色系，並加入像素化邊框、文字與動畫效果。
```html
<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>像素甜點對對碰 - 咖啡廳任務</title>
    <style>
        /* 引入像素風格字體 */
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            image-rendering: pixelated;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            font-family: 'Press Start 2P', monospace;
            background: #2B1E14;  /* 深咖啡基底 */
            color: #5E3023;
            -webkit-tap-highlight-color: transparent;
        }

        /* 像素化背景 (格紋) */
        .pixel-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #F3E9DC;  /* 奶油色主底 */
            z-index: -2;
        }
        /* 像素點陣裝飾 */
        .pixel-bg::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(to right, #C08552 1px, transparent 1px),
                linear-gradient(to bottom, #C08552 1px, transparent 1px);
            background-size: 24px 24px;
            opacity: 0.2;
            pointer-events: none;
        }

        /* 像素風波動 (方塊擴散) */
        .pixel-wave {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, #C08552 0px, #C08552 2px, transparent 2px, transparent 8px);
            animation: pixelShift 2s steps(4) infinite;
            pointer-events: none;
            z-index: -1;
            opacity: 0.25;
        }

        @keyframes pixelShift {
            0% { background-position: 0 0; }
            100% { background-position: 0 8px; }
        }

        /* 掃描線 - 像素化橫條 */
        .scan-line-pixel {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, rgba(192, 133, 82, 0.15) 0px, rgba(192, 133, 82, 0.15) 4px, transparent 4px, transparent 8px);
            pointer-events: none;
            z-index: 10;
        }

        .game-container {
            width: 100vw;
            height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 16px;
            padding-bottom: 70px;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            -webkit-overflow-scrolling: touch;
        }

        /* 像素邊框公用 */
        .pixel-border {
            border: 4px solid #5E3023;
            box-shadow: inset 0 0 0 2px #F3E9DC, 0 0 0 2px #895737;
            background: #FDF8F0;
        }

        /* 狀態欄 - 像素塊風格 */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #F3E9DC;
            border: 4px solid #5E3023;
            margin-bottom: 16px;
            position: relative;
            flex-shrink: 0;
            image-rendering: pixelated;
            box-shadow: 3px 3px 0 #895737;
        }
        .status-bar::before {
            content: '🍰 MISSION';
            position: absolute;
            top: -12px;
            left: 12px;
            background: #F3E9DC;
            padding: 0 8px;
            color: #C08552;
            font-size: 10px;
            font-family: 'Press Start 2P', monospace;
            border-left: 2px solid #5E3023;
            border-right: 2px solid #5E3023;
        }
        .level-info span {
            color: #5E3023;
            font-size: 12px;
        }

        /* 能量條 - 像素分段 */
        .energy-container {
            margin-bottom: 16px;
            flex-shrink: 0;
        }
        .energy-label {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            margin-bottom: 6px;
            color: #895737;
            font-family: 'Press Start 2P', monospace;
        }
        .energy-bar-bg {
            width: 100%;
            height: 20px;
            background: #EADBC6;
            border: 3px solid #5E3023;
            padding: 2px;
        }
        .energy-fill {
            height: 100%;
            background: repeating-linear-gradient(90deg, #C08552, #C08552 6px, #895737 6px, #895737 12px);
            width: 60%;
            transition: width 0.2s steps(10);
        }

        /* 地點標頭 */
        .location-header {
            text-align: center;
            padding: 16px;
            background: #F3E9DC;
            border: 4px solid #5E3023;
            margin-bottom: 16px;
            flex-shrink: 0;
            box-shadow: 3px 3px 0 #C08552;
        }
        .location-name {
            font-size: 18px;
            letter-spacing: 1px;
            color: #5E3023;
            text-shadow: 2px 2px 0 #C08552;
        }
        .level-badge {
            font-size: 10px;
            color: #895737;
            margin-top: 8px;
        }

        /* 計時器 - 像素大字 */
        .timer {
            font-size: 32px;
            font-weight: bold;
            font-family: 'Press Start 2P', monospace;
            color: #5E3023;
            text-shadow: 3px 3px 0 #C08552;
            text-align: center;
            margin-bottom: 16px;
            flex-shrink: 0;
            background: #F3E9DC;
            padding: 8px;
            border: 4px solid #5E3023;
            display: inline-block;
            width: auto;
            align-self: center;
        }

        /* 區域卡片 - 像素風 */
        .area-card {
            background: #FDF8F0;
            border: 4px solid #5E3023;
            padding: 16px;
            margin-bottom: 20px;
            flex-shrink: 0;
            box-shadow: 4px 4px 0 #895737;
        }
        .section-title {
            color: #C08552;
            margin-bottom: 12px;
            font-size: 12px;
            letter-spacing: 1px;
            border-bottom: 2px dotted #C08552;
            display: inline-block;
            padding-bottom: 4px;
        }
        .image-container {
            width: 100%;
            aspect-ratio: 4/3;
            background: #EADBC6;
            border: 3px solid #5E3023;
            overflow: hidden;
            margin-bottom: 12px;
            image-rendering: crisp-edges;
        }
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            image-rendering: pixelated;
        }
        .placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #C08552;
            background: #F3E9DC;
            font-size: 10px;
            text-align: center;
        }
        .placeholder i { font-size: 32px; display: block; margin-bottom: 6px; }

        /* 相似度計量器 - 像素條 */
        .similarity-meter {
            margin-top: 12px;
            padding: 12px;
            background: #F3E9DC;
            border: 3px solid #5E3023;
        }
        .meter-label {
            color: #5E3023;
            margin-bottom: 6px;
            font-size: 10px;
        }
        .meter-bar {
            width: 100%;
            height: 14px;
            background: #EADBC6;
            border: 2px solid #5E3023;
            padding: 1px;
        }
        .meter-fill {
            height: 100%;
            width: 0%;
            transition: width 0.2s steps(8);
        }
        .meter-fill.high { background: #895737; }
        .meter-fill.medium { background: #C08552; }
        .meter-fill.low { background: #B28B5E; }

        /* 像素按鈕 */
        .btn {
            width: 100%;
            padding: 14px;
            font-size: 12px;
            font-family: 'Press Start 2P', monospace;
            border: none;
            background: #C08552;
            color: #F3E9DC;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            margin-top: 12px;
            transition: none;
            box-shadow: 4px 4px 0 #5E3023;
            image-rendering: pixelated;
        }
        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 #5E3023;
            background: #895737;
        }
        .btn:disabled {
            opacity: 0.6;
            transform: none;
            cursor: not-allowed;
            background: #B28B5E;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            image-rendering: crisp-edges;
        }
        #video.visible { display: block; }

        .photo-actions {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }
        .photo-actions .btn {
            flex: 1;
            margin-top: 0;
        }

        .back-button {
            position: fixed;
            top: 14px;
            left: 14px;
            z-index: 100;
        }
        .back-button a {
            color: #F3E9DC;
            text-decoration: none;
            border: 3px solid #5E3023;
            padding: 6px 10px;
            font-size: 10px;
            background: #C08552;
            font-family: 'Press Start 2P', monospace;
            box-shadow: 2px 2px 0 #5E3023;
        }
        .back-button a:active {
            transform: translate(2px,2px);
            box-shadow: none;
        }

        .bottom-buttons {
            margin-top: 8px;
            margin-bottom: 20px;
            flex-shrink: 0;
        }

        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #5E3023;
            border: 4px solid #C08552;
            padding: 12px 20px;
            font-size: 11px;
            font-family: 'Press Start 2P', monospace;
            z-index: 1000;
            display: none;
            text-align: center;
            white-space: nowrap;
            color: #F3E9DC;
            box-shadow: 6px 6px 0 #2B1E14;
        }
        .toast.show { display: block; animation: pixelFade 0.2s steps(3); }

        @keyframes pixelFade {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }

        .shake {
            animation: pixelShake 0.2s steps(2) infinite;
        }
        @keyframes pixelShake {
            0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)}
        }

        #cameraStatus.online { color: #895737; }
        #cameraStatus.offline { color: #C08552; }
        
        /* 調整一些小間距 */
        .timer-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="pixel-bg"></div>
    <div class="pixel-wave"></div>
    <div class="scan-line-pixel"></div>

    <div class="back-button"><a href="#">← EXIT</a></div>

    <div class="game-container">
        <div class="status-bar">
            <div class="level-info"><span>☕ SWEET CAFE</span></div>
            <div class="timer" id="timer" style="font-size:24px; margin:0;">--:--</div>
        </div>

        <div class="energy-container">
            <div class="energy-label"><span>🍬 負能量清除</span><span id="energyPercent">60%</span></div>
            <div class="energy-bar-bg"><div class="energy-fill" id="energyFill" style="width: 60%"></div></div>
        </div>

        <div class="location-header" id="locationHeader" style="display: none;">
            <div class="location-name">🧁 咖啡廳區域</div>
            <div class="level-badge" id="levelInfo">LEVEL 1/5 | TIME 5:00</div>
        </div>

        <div class="area-card" id="challengeArea" style="display: none;">
            <div class="section-title">🎯 目標甜點照片</div>
            <div class="image-container" id="targetContainer">
                <img id="targetImg" src="" alt="TARGET" style="width:100%; height:100%; object-fit:cover; display:none;">
                <div class="placeholder" id="targetPlaceholder"><i>🍰</i><p>讀取關卡中...</p></div>
            </div>
        </div>

        <div class="similarity-meter" id="similarityMeter" style="display:none">
            <div class="meter-label">✨ 相似度比對 ✨</div>
            <div class="meter-bar"><div class="meter-fill" id="similarityFill" style="width:0%"></div></div>
            <div id="similarityText" style="text-align:center; margin-top:6px; color:#5E3023; font-size:10px">0%</div>
        </div>

        <div class="area-card" id="cameraArea" style="display: none;">
            <div class="section-title">📷 像素相機</div>
            <div class="image-container">
                <video id="video" autoplay playsinline></video>
                <canvas id="canvas" style="display:none"></canvas>
                <div class="placeholder" id="cameraPlaceholder"><i>🎥</i><p>相機離線中</p></div>
            </div>
            <div class="photo-actions">
                <button class="btn" id="takePhotoBtn" disabled>📸 拍攝</button>
                <button class="btn" id="submitBtn" disabled>⬆ 提交</button>
            </div>
            <div id="cameraStatus" style="text-align:center; margin-top:8px; font-size:9px">離線</div>
        </div>

        <div class="bottom-buttons">
            <button class="btn" id="nextLevelBtn" style="display:none">⏭ 下一關</button>
        </div>
        
        <div class="area-card" id="cafeIntroCard">
            <div class="section-title">📍 咖啡廳·甜點任務</div>
            <div class="image-container">
                <img id="cafeImage" src="https://i.postimg.cc/fJ7ZjFSX/IMG-9835.jpg" alt="CAFE" style="filter: contrast(110%) brightness(95%);">
            </div>
            <button class="btn" id="startMatchingBtn">▶ 開始匹配</button>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // ========== 像素甜點任務 第三關卡 ==========
        // 採用咖啡/焦糖色調，保留原本5張圖片 (甜點風格)
        const LEVEL_IMAGES = [
            "https://i.postimg.cc/YGty7nqQ/IMG-9809.jpg",
            "https://i.postimg.cc/kVQhk39t/IMG-9811.jpg",
            "https://i.postimg.cc/cvVVpB3S/IMG-9812.jpg",
            "https://i.postimg.cc/9wFSdx6F/IMG-9813.jpg",
            "https://i.postimg.cc/7fQvVkYG/IMG-9815.jpg"
        ];
        
        const LEVEL_TIMES = [300, 240, 180, 120, 60];
        const MAX_REDUCTION_PER_LEVEL = 4;
        
        function getReductionBySimilarity(similarity) {
            if (similarity >= 95) return 4.0;
            if (similarity >= 90) return 3.5;
            if (similarity >= 85) return 3.0;
            if (similarity >= 80) return 2.5;
            if (similarity >= 75) return 2.0;
            if (similarity >= 70) return 1.5;
            if (similarity >= 65) return 1.0;
            if (similarity >= 60) return 0.5;
            return 0;
        }
        
        let gameState = {
            currentLevel: 1,
            energy: 60,
            timer: 0,
            timerInterval: null,
            camera: null,
            cameraActive: false,
            currentPhoto: null,
            currentSimilarity: 0,
            isSubmitted: false,
            levelCompleted: false,
            gameActive: false
        };
        
        // DOM 元素
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const targetImg = document.getElementById('targetImg');
        const targetPlaceholder = document.getElementById('targetPlaceholder');
        const similarityMeter = document.getElementById('similarityMeter');
        const similarityFill = document.getElementById('similarityFill');
        const similarityText = document.getElementById('similarityText');
        const takePhotoBtn = document.getElementById('takePhotoBtn');
        const submitBtn = document.getElementById('submitBtn');
        const nextLevelBtn = document.getElementById('nextLevelBtn');
        const timerDisplay = document.getElementById('timer');
        const levelInfo = document.getElementById('levelInfo');
        const energyFill = document.getElementById('energyFill');
        const energyPercent = document.getElementById('energyPercent');
        const cafeIntroCard = document.getElementById('cafeIntroCard');
        const locationHeader = document.getElementById('locationHeader');
        const challengeArea = document.getElementById('challengeArea');
        const cameraArea = document.getElementById('cameraArea');
        
        async function startMatching() {
            cafeIntroCard.style.display = 'none';
            locationHeader.style.display = 'block';
            challengeArea.style.display = 'block';
            cameraArea.style.display = 'block';
            await initCamera();
            startLevel();
        }
        
        async function initCamera() {
            try {
                const constraints = { video: { width: { ideal: 960 }, height: { ideal: 720 }, facingMode: 'environment' } };
                gameState.camera = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = gameState.camera;
                await new Promise(resolve => { video.onloadedmetadata = () => { video.play(); resolve(); }; });
                video.classList.add('visible');
                document.getElementById('cameraPlaceholder').style.display = 'none';
                canvas.width = video.videoWidth || 640;
                canvas.height = video.videoHeight || 480;
                gameState.cameraActive = true;
                document.getElementById('cameraStatus').textContent = '🟢 連線中';
                document.getElementById('cameraStatus').style.color = '#895737';
                takePhotoBtn.disabled = false;
                showToast("📷 相機就緒！");
            } catch (error) {
                showToast("❌ 無法取得相機權限", "error");
                document.getElementById('cameraStatus').textContent = '🔴 離線';
                takePhotoBtn.disabled = true;
            }
        }
        
        function startLevel() {
            const levelIdx = gameState.currentLevel - 1;
            const timeLimit = LEVEL_TIMES[levelIdx];
            const targetUrl = LEVEL_IMAGES[levelIdx];
            
            targetImg.src = targetUrl;
            targetImg.style.display = 'block';
            targetPlaceholder.style.display = 'none';
            
            levelInfo.innerHTML = `LEVEL ${gameState.currentLevel}/5 | TIME ${Math.floor(timeLimit/60)}:${(timeLimit%60).toString().padStart(2,'0')}`;
            
            gameState.isSubmitted = false;
            gameState.levelCompleted = false;
            gameState.currentPhoto = null;
            gameState.currentSimilarity = 0;
            similarityMeter.style.display = 'none';
            submitBtn.disabled = true;
            nextLevelBtn.style.display = 'none';
            takePhotoBtn.disabled = !gameState.cameraActive;
            takePhotoBtn.textContent = "📸 拍攝";
            submitBtn.style.display = 'block';
            
            startTimer(timeLimit);
        }
        
        function startTimer(seconds) {
            if (gameState.timerInterval) clearInterval(gameState.timerInterval);
            gameState.timer = seconds;
            updateTimerDisplay();
            
            gameState.timerInterval = setInterval(() => {
                if (gameState.timer <= 0) {
                    clearInterval(gameState.timerInterval);
                    if (!gameState.isSubmitted && !gameState.levelCompleted) {
                        handleTimeout();
                    }
                } else {
                    gameState.timer--;
                    updateTimerDisplay();
                }
            }, 1000);
        }
        
        function updateTimerDisplay() {
            const mins = Math.floor(gameState.timer / 60);
            const secs = gameState.timer % 60;
            timerDisplay.textContent = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
            if (gameState.timer <= 10) timerDisplay.style.color = "#C08552";
            else timerDisplay.style.color = "#5E3023";
        }
        
        function handleTimeout() {
            showToast("⏰ 時間用盡！關卡失敗", "error");
            gameState.levelCompleted = true;
            takePhotoBtn.disabled = true;
            submitBtn.disabled = true;
            nextLevelBtn.style.display = 'block';
            nextLevelBtn.textContent = "🔄 重試關卡";
        }
        
        function takePhoto() {
            if (!gameState.cameraActive) { showToast("相機未連線", "error"); return; }
            if (gameState.isSubmitted) { showToast("已完成此關卡", "warning"); return; }
            
            const ctx = canvas.getContext('2d');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            gameState.currentPhoto = canvas.toDataURL('image/jpeg', 0.92);
            
            takePhotoBtn.textContent = "📸 重拍";
            showToast("🍪 拍攝完畢！分析相似度...");
            calculateSimilarity();
        }
        
        function calculateSimilarity() {
            if (gameState.isSubmitted) return;
            // 模擬相似度 (保留挑戰感)
            let base = 45 + Math.random() * 48;
            let bonus = Math.floor(Math.random() * 12);
            let similarity = Math.min(98, base + bonus);
            similarity = Math.floor(similarity);
            gameState.currentSimilarity = similarity;
            displaySimilarity(similarity);
            submitBtn.disabled = false;
            
            if (similarity >= 90) showToast(`🍰 完美！${similarity}% 相似，可提交`, "success");
            else if (similarity >= 70) showToast(`👍 不錯！${similarity}% 相似`, "info");
            else showToast(`📸 ${similarity}% 相似，提交可清除負能量`, "info");
        }
        
        function displaySimilarity(percent) {
            similarityMeter.style.display = 'block';
            similarityFill.style.width = percent + '%';
            similarityText.textContent = percent + '%';
            if (percent >= 80) similarityFill.className = 'meter-fill high';
            else if (percent >= 50) similarityFill.className = 'meter-fill medium';
            else similarityFill.className = 'meter-fill low';
        }
        
        function submitMatch() {
            if (gameState.isSubmitted) return;
            let reduction = getReductionBySimilarity(gameState.currentSimilarity);
            const timeBonus = Math.min(1.5, Math.floor(gameState.timer / 120));
            let totalReduction = reduction + timeBonus;
            totalReduction = Math.min(MAX_REDUCTION_PER_LEVEL, totalReduction);
            totalReduction = Math.min(gameState.energy, totalReduction);
            
            gameState.energy = Math.max(0, gameState.energy - totalReduction);
            updateEnergyBar();
            
            let gradeMsg = "";
            if (gameState.currentSimilarity >= 90) gradeMsg = "✨ 甜點大師！✨";
            else if (gameState.currentSimilarity >= 70) gradeMsg = "🍮 好味道！";
            else if (gameState.currentSimilarity >= 50) gradeMsg = "🍩 尚可接受";
            else gradeMsg = "🧁 不太像唷";
            
            if (totalReduction > 0) {
                showToast(`${gradeMsg} | 清除 ${totalReduction.toFixed(1)}% 負能量`, "info");
            } else {
                showToast(`${gradeMsg} | 未能清除能量`, "warning");
            }
            
            gameState.isSubmitted = true;
            gameState.levelCompleted = true;
            takePhotoBtn.disabled = true;
            submitBtn.disabled = true;
            if (gameState.timerInterval) clearInterval(gameState.timerInterval);
            
            if (gameState.currentLevel === 5) {
                if (gameState.energy <= 0) {
                    showToast("🏆 全數過關！負能量歸零！任務成功！");
                    nextLevelBtn.textContent = "🎉 圓滿完成 🎉";
                } else {
                    nextLevelBtn.textContent = "🏁 完成任務";
                }
                nextLevelBtn.style.display = 'block';
            } else {
                nextLevelBtn.style.display = 'block';
                nextLevelBtn.textContent = "⏭ 下一關";
            }
        }
        
        function updateEnergyBar() {
            let percentVal = Math.floor(gameState.energy);
            energyFill.style.width = percentVal + '%';
            energyPercent.textContent = percentVal + '%';
            if (gameState.energy <= 20) energyFill.style.background = "repeating-linear-gradient(90deg, #C08552, #C08552 6px, #B87333 6px, #B87333 12px)";
        }
        
        function nextLevel() {
            if (gameState.currentLevel < 5) {
                gameState.currentLevel++;
                gameState.isSubmitted = false;
                gameState.levelCompleted = false;
                gameState.currentPhoto = null;
                gameState.currentSimilarity = 0;
                similarityMeter.style.display = 'none';
                submitBtn.disabled = true;
                nextLevelBtn.style.display = 'none';
                takePhotoBtn.disabled = !gameState.cameraActive;
                takePhotoBtn.textContent = "📸 拍攝";
                startLevel();
            } else {
                showToast("🎉 恭喜完成所有關卡！回到首頁");
                setTimeout(() => {
                    if (window.location.href.includes('index.html')) window.location.href = 'index.html';
                    else window.location.href = '#';
                }, 1800);
            }
        }
        
        function showToast(msg, type = "info") {
            const toastEl = document.getElementById('toast');
            toastEl.textContent = msg;
            toastEl.classList.add('show');
            if (type === "error") toastEl.style.background = "#5E3023";
            else if (type === "warning") toastEl.style.background = "#C08552";
            else toastEl.style.background = "#895737";
            setTimeout(() => toastEl.classList.remove('show'), 2000);
        }
        
        window.addEventListener('beforeunload', () => {
            if (gameState.camera) gameState.camera.getTracks().forEach(t => t.stop());
            if (gameState.timerInterval) clearInterval(gameState.timerInterval);
        });
        
        document.getElementById('startMatchingBtn').addEventListener('click', startMatching);
        document.getElementById('takePhotoBtn').addEventListener('click', takePhoto);
        document.getElementById('submitBtn').addEventListener('click', submitMatch);
        document.getElementById('nextLevelBtn').addEventListener('click', nextLevel);
    </script>
</body>
</html>
