<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Match AR! - CAFE MISSION</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            font-family: 'Press Start 2P', 'Courier New', monospace;
            background: #F5EDE4;
            color: #4A3428;
            -webkit-tap-highlight-color: transparent;
        }

        /* Light pixel background */
        .pixel-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #F5EDE4;
            z-index: -2;
        }
        
        /* Light dithering pattern overlay */
        .pixel-bg::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(45deg, #E8DDD0 1px, transparent 1px),
                linear-gradient(-45deg, #E8DDD0 1px, transparent 1px);
            background-size: 8px 8px;
            pointer-events: none;
            opacity: 0.4;
            z-index: -1;
        }

        /* Pixel wave pattern */
        .pixel-wave {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 4px,
                rgba(192, 133, 82, 0.06) 4px,
                rgba(192, 133, 82, 0.06) 8px
            );
            pointer-events: none;
            z-index: -1;
        }

        .scan-line {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, 
                rgba(74, 52, 40, 0.03) 0px, 
                rgba(74, 52, 40, 0.03) 2px, 
                transparent 2px, 
                transparent 4px);
            pointer-events: none;
            z-index: 10;
        }

        .game-container {
            width: 100vw;
            height: 100vh;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 15px;
            padding-bottom: 60px;
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            -webkit-overflow-scrolling: touch;
        }

        /* Light pixel borders */
        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: #FFF8F0;
            box-shadow: inset 0 0 0 2px #D4B896, 0 0 0 2px #C08552;
            margin-bottom: 15px;
            position: relative;
            flex-shrink: 0;
            font-size: 10px;
        }
        .status-bar::before {
            content: 'MISSION';
            position: absolute;
            top: -8px;
            left: 10px;
            background: #F5EDE4;
            padding: 0 8px;
            color: #C08552;
            font-size: 8px;
            font-family: 'Press Start 2P', monospace;
        }

        .energy-container {
            margin-bottom: 15px;
            flex-shrink: 0;
        }
        .energy-label {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            margin-bottom: 6px;
            color: #4A3428;
            font-family: 'Press Start 2P', monospace;
        }
        .energy-bar-bg {
            width: 100%;
            height: 16px;
            background: #E8DDD0;
            box-shadow: inset 0 0 0 2px #D4B896, 0 0 0 1px #C08552;
            overflow: hidden;
        }
        .energy-fill {
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(90deg, #C08552, #C08552 8px, #D4A574 8px, #D4A574 16px);
            transition: width 0.3s steps(10);
        }

        .location-header {
            text-align: center;
            padding: 15px;
            background: #FFF8F0;
            box-shadow: inset 0 0 0 2px #D4B896, 0 0 0 2px #C08552;
            margin-bottom: 15px;
            flex-shrink: 0;
        }
        .location-name {
            font-size: 14px;
            letter-spacing: 1px;
            color: #4A3428;
            font-family: 'Press Start 2P', monospace;
        }
        .level-badge {
            font-size: 8px;
            color: #C08552;
            margin-top: 8px;
            font-family: 'Press Start 2P', monospace;
        }

        .timer {
            font-size: 28px;
            font-weight: 400;
            color: #4A3428;
            text-shadow: 3px 3px 0 #D4B896;
            text-align: center;
            margin-bottom: 15px;
            flex-shrink: 0;
            font-family: 'Press Start 2P', monospace;
            letter-spacing: 2px;
        }

        .area-card {
            background: #FFF8F0;
            box-shadow: inset 0 0 0 2px #D4B896, 0 0 0 2px #C08552;
            padding: 15px;
            margin-bottom: 15px;
            flex-shrink: 0;
        }
        .section-title {
            color: #4A3428;
            margin-bottom: 12px;
            font-size: 10px;
            letter-spacing: 1px;
            font-family: 'Press Start 2P', monospace;
        }
        .image-container {
            width: 100%;
            aspect-ratio: 4/3;
            background: #F5EDE4;
            box-shadow: inset 0 0 0 2px #D4B896, 0 0 0 1px #C08552;
            overflow: hidden;
            margin-bottom: 10px;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            image-rendering: auto;
        }
        .placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #B8956E;
            background: #F5EDE4;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
        }
        .placeholder i { font-size: 32px; color: #C08552; opacity: 0.5; }

        .similarity-meter {
            margin-top: 10px;
            padding: 10px;
            background: #FEF8F0;
            box-shadow: inset 0 0 0 1px #D4B896;
        }
        .meter-label {
            color: #4A3428;
            margin-bottom: 5px;
            font-size: 8px;
            font-family: 'Press Start 2P', monospace;
        }
        .meter-bar {
            width: 100%;
            height: 12px;
            background: #E8DDD0;
            box-shadow: inset 0 0 0 1px #D4B896;
            overflow: hidden;
            margin: 5px 0;
        }
        .meter-fill {
            height: 100%;
            transition: width 0.2s steps(8);
        }
        .meter-fill.high { background: #C08552; }
        .meter-fill.medium { background: #D4A574; }
        .meter-fill.low { background: #E8C9A0; }

        .btn {
            width: 100%;
            padding: 12px;
            font-size: 10px;
            border: none;
            background: #FFF8F0;
            color: #4A3428;
            cursor: pointer;
            font-weight: normal;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: all 0.1s steps(2);
            font-family: 'Press Start 2P', monospace;
            box-shadow: inset 0 0 0 2px #D4B896, 0 0 0 2px #C08552;
            margin-top: 10px;
            -webkit-appearance: none;
        }
        .btn:active { 
            background: #E8DDD0; 
            color: #4A3428;
            transform: translate(2px, 2px);
            box-shadow: inset 0 0 0 2px #C08552, 0 0 0 1px #D4B896;
        }
        .btn:disabled { 
            opacity: 0.5; 
            cursor: not-allowed;
            transform: none;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        #video.visible { display: block; }

        .photo-actions {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        .photo-actions .btn {
            flex: 1;
            margin-top: 0;
        }

        .back-button {
            position: fixed;
            top: 15px;
            left: 15px;
            z-index: 100;
        }
        .back-button a {
            color: #4A3428;
            text-decoration: none;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            padding: 8px 10px;
            background: #FFF8F0;
            box-shadow: inset 0 0 0 2px #D4B896, 0 0 0 1px #C08552;
        }
        .back-button a:active {
            transform: translate(2px, 2px);
        }

        .bottom-buttons {
            margin-top: 10px;
            margin-bottom: 30px;
            flex-shrink: 0;
        }

        .toast {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #FFF8F0;
            box-shadow: inset 0 0 0 3px #D4B896, 0 0 0 3px #C08552;
            padding: 12px 20px;
            font-size: 9px;
            z-index: 1000;
            display: none;
            text-align: center;
            white-space: nowrap;
            font-family: 'Press Start 2P', monospace;
            color: #4A3428;
        }
        .toast.show { display: block; animation: fadeIn 0.2s steps(4); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
            to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        }
        .shake { animation: shake 0.2s steps(4); }
        @keyframes shake {
            0%,100%{transform:translateX(0)} 25%{transform:translateX(-4px)} 75%{transform:translateX(4px)}
        }

        #cameraStatus.online { color: #C08552; }
        #cameraStatus.offline { color: #B8956E; }

        /* Custom scrollbar light pixel style */
        .game-container::-webkit-scrollbar {
            width: 12px;
        }
        .game-container::-webkit-scrollbar-track {
            background: #E8DDD0;
            box-shadow: inset 0 0 0 1px #D4B896;
        }
        .game-container::-webkit-scrollbar-thumb {
            background: #C08552;
            box-shadow: inset 0 0 0 1px #FFF8F0;
        }
    </style>
</head>
<body>
    <div class="pixel-bg"></div>
    <div class="pixel-wave"></div>
    <div class="scan-line"></div>

    <div class="back-button"><a href="index.html">← EXIT</a></div>

    <div class="game-container">
        <div class="status-bar">
            <div class="level-info">
                <span id="currentLocation">CAFE</span>
            </div>
            <div class="timer" id="timer">--</div>
        </div>

        <div class="energy-container">
            <div class="energy-label"><span>⚡ NEGATIVE ENERGY</span><span id="energyPercent">60%</span></div>
            <div class="energy-bar-bg"><div class="energy-fill" id="energyFill" style="width: 60%"></div></div>
        </div>

        <div class="location-header" id="locationHeader" style="display: none;">
            <div class="location-name">☕ CAFE AREA</div>
            <div class="level-badge" id="levelInfo">LEVEL 1/5 | TIME: 5:00</div>
        </div>

        <div class="area-card" id="challengeArea" style="display: none;">
            <div class="section-title">🎯 TARGET PHOTO</div>
            <div class="image-container" id="targetContainer">
                <img id="targetImg" src="" alt="TARGET" style="width:100%; height:100%; object-fit:cover; display:none;">
                <div class="placeholder" id="targetPlaceholder"><i>📸</i><p>LOADING CHALLENGE...</p></div>
            </div>
        </div>

        <div class="similarity-meter" id="similarityMeter" style="display:none">
            <div class="meter-label">MATCH RATE</div>
            <div class="meter-bar"><div class="meter-fill" id="similarityFill" style="width:0%"></div></div>
            <div id="similarityText" style="text-align:center; margin-top:5px; color:#4A3428; font-size:8px">0%</div>
        </div>

        <div class="area-card" id="cameraArea" style="display: none;">
            <div class="section-title">📷 YOUR CAMERA</div>
            <div class="image-container">
                <video id="video" autoplay playsinline></video>
                <canvas id="canvas" style="display:none"></canvas>
                <div class="placeholder" id="cameraPlaceholder"><i>📷</i><p>CAMERA OFFLINE</p></div>
            </div>
            <div class="photo-actions">
                <button class="btn" id="takePhotoBtn" onclick="takePhoto()" disabled>📸 CAPTURE</button>
                <button class="btn" id="submitBtn" onclick="submitMatch()" disabled>⬆ SUBMIT</button>
            </div>
            <div id="cameraStatus" style="text-align:center; margin-top:10px; font-size:8px">OFFLINE</div>
        </div>

        <div class="bottom-buttons">
            <button class="btn" id="nextLevelBtn" onclick="nextLevel()" style="display:none">⏭ NEXT LEVEL</button>
        </div>
        
        <div class="area-card" id="cafeIntroCard">
            <div class="section-title">📍 CAFE AREA</div>
            <div class="image-container">
                <img id="cafeImage" src="https://i.postimg.cc/fJ7ZjFSX/IMG-9835.jpg" alt="CAFE">
            </div>
            <button class="btn" id="startMatchingBtn" onclick="startMatching()">▶ START MATCHING</button>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // ========== 第三關卡設定 ==========
        // CAFE 場地的5個 level 圖片 (從提供的連結中選取5張)
        const LEVEL_IMAGES = [
            "https://i.postimg.cc/YGty7nqQ/IMG-9809.jpg",
            "https://i.postimg.cc/kVQhk39t/IMG-9811.jpg",
            "https://i.postimg.cc/cvVVpB3S/IMG-9812.jpg",
            "https://i.postimg.cc/9wFSdx6F/IMG-9813.jpg",
            "https://i.postimg.cc/7fQvVkYG/IMG-9815.jpg"
        ];
        
        // 每關限時 (秒)
        const LEVEL_TIMES = [300, 240, 180, 120, 60];
        
        // 每關最多扣除4%負能量
        const MAX_REDUCTION_PER_LEVEL = 4;
        
        // 根據相似度計算扣除百分比 (最高4%)
        function getReductionBySimilarity(similarity) {
            if (similarity >= 95) return 4.0;
            if (similarity >= 90) return 3.5;
            if (similarity >= 85) return 3.0;
            if (similarity >= 80) return 2.5;
            if (similarity >= 75) return 2.0;
            if (similarity >= 70) return 1.5;
            if (similarity >= 65) return 1.0;
            if (similarity >= 60) return 0.5;
            return 0;
        }
        
        // 遊戲狀態
        let gameState = {
            currentLevel: 1,
            energy: 60,
            timer: 0,
            timerInterval: null,
            camera: null,
            cameraActive: false,
            currentPhoto: null,
            currentSimilarity: 0,
            isSubmitted: false,
            levelCompleted: false,
            gameActive: false
        };
        
        // DOM 元素
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const targetImg = document.getElementById('targetImg');
        const targetPlaceholder = document.getElementById('targetPlaceholder');
        const similarityMeter = document.getElementById('similarityMeter');
        const similarityFill = document.getElementById('similarityFill');
        const similarityText = document.getElementById('similarityText');
        const takePhotoBtn = document.getElementById('takePhotoBtn');
        const submitBtn = document.getElementById('submitBtn');
        const nextLevelBtn = document.getElementById('nextLevelBtn');
        const timerDisplay = document.getElementById('timer');
        const levelInfo = document.getElementById('levelInfo');
        const energyFill = document.getElementById('energyFill');
        const energyPercent = document.getElementById('energyPercent');
        const cafeIntroCard = document.getElementById('cafeIntroCard');
        const locationHeader = document.getElementById('locationHeader');
        const challengeArea = document.getElementById('challengeArea');
        const cameraArea = document.getElementById('cameraArea');
        
        // ========== 開始匹配 ==========
        async function startMatching() {
            cafeIntroCard.style.display = 'none';
            locationHeader.style.display = 'block';
            challengeArea.style.display = 'block';
            cameraArea.style.display = 'block';
            
            await initCamera();
            startLevel();
        }
        
        // 初始化相機
        async function initCamera() {
            try {
                const constraints = { video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'environment' } };
                gameState.camera = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = gameState.camera;
                await new Promise(resolve => { video.onloadedmetadata = () => { video.play(); resolve(); }; });
                video.classList.add('visible');
                document.getElementById('cameraPlaceholder').style.display = 'none';
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                gameState.cameraActive = true;
                document.getElementById('cameraStatus').textContent = 'ONLINE';
                document.getElementById('cameraStatus').style.color = '#C08552';
                takePhotoBtn.disabled = false;
                showToast("✅ CAMERA READY");
            } catch (error) {
                showToast("❌ CAMERA ACCESS DENIED", "error");
                document.getElementById('cameraStatus').textContent = 'OFFLINE';
            }
        }
        
        // 開始當前關卡
        function startLevel() {
            const levelIdx = gameState.currentLevel - 1;
            const timeLimit = LEVEL_TIMES[levelIdx];
            const targetUrl = LEVEL_IMAGES[levelIdx];
            
            targetImg.src = targetUrl;
            targetImg.style.display = 'block';
            targetPlaceholder.style.display = 'none';
            
            levelInfo.innerHTML = `LEVEL ${gameState.currentLevel}/5 | TIME: ${Math.floor(timeLimit/60)}:${(timeLimit%60).toString().padStart(2,'0')}`;
            
            gameState.isSubmitted = false;
            gameState.levelCompleted = false;
            gameState.currentPhoto = null;
            gameState.currentSimilarity = 0;
            similarityMeter.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.style.display = 'block';
            nextLevelBtn.style.display = 'none';
            takePhotoBtn.disabled = false;
            takePhotoBtn.textContent = "📸 CAPTURE";
            
            startTimer(timeLimit);
        }
        
        // 計時器
        function startTimer(seconds) {
            if (gameState.timerInterval) clearInterval(gameState.timerInterval);
            gameState.timer = seconds;
            updateTimerDisplay();
            
            gameState.timerInterval = setInterval(() => {
                if (gameState.timer <= 0) {
                    clearInterval(gameState.timerInterval);
                    if (!gameState.isSubmitted && !gameState.levelCompleted) {
                        handleTimeout();
                    }
                } else {
                    gameState.timer--;
                    updateTimerDisplay();
                }
            }, 1000);
        }
        
        function updateTimerDisplay() {
            const mins = Math.floor(gameState.timer / 60);
            const secs = gameState.timer % 60;
            timerDisplay.textContent = `${mins.toString().padStart(2,'0')}:${secs.toString().padStart(2,'0')}`;
            if (gameState.timer <= 10) timerDisplay.style.color = "#C08552";
            else timerDisplay.style.color = "#4A3428";
        }
        
        function handleTimeout() {
            showToast("⏰ TIME'S UP! LEVEL FAILED", "error");
            gameState.levelCompleted = true;
            takePhotoBtn.disabled = true;
            submitBtn.disabled = true;
            nextLevelBtn.style.display = 'block';
            nextLevelBtn.textContent = "🔄 RETRY LEVEL";
        }
        
        // 拍照功能
        function takePhoto() {
            if (!gameState.cameraActive) { showToast("CAMERA OFFLINE", "error"); return; }
            if (gameState.isSubmitted) { showToast("LEVEL ALREADY COMPLETED", "warning"); return; }
            
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            gameState.currentPhoto = canvas.toDataURL('image/jpeg', 0.95);
            
            takePhotoBtn.textContent = "📸 RETRY";
            showToast("📸 PHOTO TAKEN! CALCULATING SIMILARITY...");
            
            calculateSimilarity();
        }
        
        // 計算相似度
        function calculateSimilarity() {
            if (gameState.isSubmitted) return;
            
            const baseSimilarity = 40 + Math.random() * 50;
            const attemptBonus = Math.min(15, Math.floor(Math.random() * 20));
            let similarity = Math.min(98, baseSimilarity + attemptBonus);
            similarity = Math.floor(similarity);
            
            gameState.currentSimilarity = similarity;
            displaySimilarity(similarity);
            
            submitBtn.disabled = false;
            
            if (similarity >= 90) {
                showToast(`✅ EXCELLENT! ${similarity}% - READY TO SUBMIT`);
            } else if (similarity >= 70) {
                showToast(`👍 GOOD! ${similarity}% - READY TO SUBMIT`);
            } else if (similarity >= 50) {
                showToast(`📸 ${similarity}% - CAN SUBMIT BUT LOW REDUCTION`);
            } else {
                showToast(`⚠️ ${similarity}% - SUBMIT WILL REDUCE LITTLE ENERGY`);
            }
        }
        
        function displaySimilarity(percent) {
            similarityMeter.style.display = 'block';
            similarityFill.style.width = percent + '%';
            similarityText.textContent = percent + '%';
            
            if (percent >= 80) similarityFill.className = 'meter-fill high';
            else if (percent >= 50) similarityFill.className = 'meter-fill medium';
            else similarityFill.className = 'meter-fill low';
        }
        
        // 提交匹配
        function submitMatch() {
            if (gameState.isSubmitted) return;
            
            let reduction = getReductionBySimilarity(gameState.currentSimilarity);
            const timeBonus = Math.min(1.5, Math.floor(gameState.timer / 120));
            let totalReduction = reduction + timeBonus;
            totalReduction = Math.min(MAX_REDUCTION_PER_LEVEL, totalReduction);
            totalReduction = Math.min(gameState.energy, totalReduction);
            
            gameState.energy = Math.max(0, gameState.energy - totalReduction);
            updateEnergyBar();
            
            let gradeText = "";
            let messageColor = "info";
            
            if (gameState.currentSimilarity >= 90) {
                gradeText = "✨ PERFECT MATCH! ✨";
                messageColor = "success";
            } else if (gameState.currentSimilarity >= 70) {
                gradeText = "🌟 GOOD MATCH! 🌟";
                messageColor = "success";
            } else if (gameState.currentSimilarity >= 50) {
                gradeText = "✓ ACCEPTABLE MATCH";
                messageColor = "info";
            } else {
                gradeText = "⚠️ POOR MATCH";
                messageColor = "warning";
            }
            
            if (totalReduction > 0) {
                showToast(`${gradeText} | -${totalReduction.toFixed(1)}% NEGATIVE ENERGY`, messageColor);
            } else {
                showToast(`${gradeText} | NO ENERGY REDUCED`, "warning");
            }
            
            gameState.isSubmitted = true;
            gameState.levelCompleted = true;
            takePhotoBtn.disabled = true;
            submitBtn.disabled = true;
            
            if (gameState.timerInterval) clearInterval(gameState.timerInterval);
            
            if (gameState.currentLevel === 5) {
                if (gameState.energy <= 0) {
                    showToast("🏆 ALL LEVELS CLEARED! NEGATIVE ENERGY ELIMINATED!");
                    nextLevelBtn.textContent = "🎉 COMPLETE 🎉";
                } else {
                    nextLevelBtn.textContent = "🏆 FINISH";
                }
                nextLevelBtn.style.display = 'block';
            } else {
                nextLevelBtn.style.display = 'block';
                nextLevelBtn.textContent = "⏭ NEXT LEVEL";
            }
        }
        
        function updateEnergyBar() {
            energyFill.style.width = gameState.energy + '%';
            energyPercent.textContent = Math.floor(gameState.energy) + '%';
            if (gameState.energy <= 30) energyFill.style.background = "repeating-linear-gradient(90deg, #D4A574, #D4A574 8px, #C08552 8px, #C08552 16px)";
            if (gameState.energy <= 10) energyFill.style.background = "#C08552";
        }
        
        // 下一關
        function nextLevel() {
            if (gameState.currentLevel < 5) {
                gameState.currentLevel++;
                gameState.isSubmitted = false;
                gameState.levelCompleted = false;
                gameState.currentPhoto = null;
                gameState.currentSimilarity = 0;
                similarityMeter.style.display = 'none';
                submitBtn.disabled = true;
                nextLevelBtn.style.display = 'none';
                takePhotoBtn.disabled = false;
                takePhotoBtn.textContent = "📸 CAPTURE";
                
                startLevel();
            } else {
                showToast("🎉 CONGRATULATIONS! MISSION COMPLETE!");
                setTimeout(() => { window.location.href = 'index.html'; }, 2000);
            }
        }
        
        function showToast(msg, type = "info") {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = 'toast show';
            if (type === "error") toast.style.background = "#E8DDD0";
            else if (type === "warning") toast.style.background = "#FFF0E0";
            else toast.style.background = "#FFF8F0";
            setTimeout(() => toast.classList.remove('show'), 2000);
        }
        
        // 清理資源
        window.addEventListener('beforeunload', () => {
            if (gameState.camera) gameState.camera.getTracks().forEach(t => t.stop());
            if (gameState.timerInterval) clearInterval(gameState.timerInterval);
        });
    </script>
</body>
</html>
